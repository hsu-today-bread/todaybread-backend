# ===========================
# Application
# ===========================
spring.application.name=server

# ===========================
# Swagger
# ===========================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.todaybread.server
springdoc.paths-to-match=/api/**

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=validate

# ===========================
# DataSource
# ===========================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# Flyway
# ===========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===========================
# JWT
# ===========================
jwt.access-token-expiration=1800000
jwt.refresh-token-expiration=604800000

# ===========================
# File Upload
# ===========================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# ===========================
# Toss Payments
# ===========================
toss.payment.secret-key=${TOSS_SECRET_KEY}
toss.payment.client-key=${TOSS_CLIENT_KEY}
toss.payment.base-url=https://api.tosspayments.com

# ===========================
# FCM Push Notification
# ===========================
notification.fcm.enabled=${FCM_ENABLED}
notification.fcm.credentials-path=${GOOGLE_APPLICATION_CREDENTIALS}

# ===========================
# Pending Order Scheduler
# ===========================
order.expiry.timeout-minutes=10
order.expiry.scheduler-interval-ms=60000
order.expiry.batch-size=100

# ===========================
# User Recovery Scheduler
# ===========================
user.recovery.cleanup-interval-ms=3600000

# ===========================
# NTS Service
# ===========================
nts.business.service-key=${NTS_BUSINESS_SERVICE_KEY}
nts.business.base-url=https://api.odcloud.kr/api/nts-businessman/v1
nts.business.connect-timeout-ms=3000
nts.business.read-timeout-ms=5000

# ===========================
# Business Approval
# ===========================
business.approval.hash-secret=${BUSINESS_APPROVAL_HASH_SECRET}
