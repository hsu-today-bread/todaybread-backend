# ===========================
# DataSource (Test H2)
# ===========================
spring.datasource.url=jdbc:h2:mem:todaybread;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ===========================
# Flyway
# ===========================
spring.flyway.enabled=false

# ===========================
# Scheduler
# ===========================
order.expiry.scheduler-enabled=false
user.recovery.cleanup-enabled=false

# ===========================
# JWT
# ===========================
jwt.secret=todaybread-test-jwt-secret-key-at-least-32-bytes

# ===========================
# File Upload
# ===========================
app.file.upload-dir=${java.io.tmpdir}/todaybread-test-uploads

# ===========================
# Toss Payments
# ===========================
toss.payment.secret-key=test_sk_dummy
toss.payment.client-key=test_ck_dummy
toss.payment.base-url=https://api.tosspayments.com

# ===========================
# FCM Push Notification
# ===========================
notification.fcm.enabled=false
notification.fcm.credentials-path=

# ===========================
# NTS Service
# ===========================
nts.business.service-key=test_dummy

# ===========================
# Business Approval
# ===========================
business.approval.hash-secret=todaybread-test-business-hash-secret-32-bytes
